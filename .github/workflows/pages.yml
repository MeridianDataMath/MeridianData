# Builds the perps snapshot, adds the Predict snapshot published from a home connection (to a repository of its own,
# see below), and deploys the site to the Cloudflare Worker with static assets (project "meridiandatahub", see
# wrangler.jsonc; works from a private repo). Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID:
# without them the run fails instead of deploying anywhere else. Runs on every push to main, every 30 minutes when the
# Cloudflare timer (cron/, deployed by cron.yml) dispatches it at :14 and :44 (a few minutes after the snapshot machine's
# runs at :09 and :39), on its own schedule every two hours as a backup (GitHub drops most scheduled runs under load), and
# on demand. A health job after it fails the run when the site's data has stopped updating (scripts/deploy-health.mjs).
#
# The Cloudflare token reaches the deploy step only, never the tests, the builders, npm or git. Third-party actions are
# pinned to commits (a moved tag cannot swap in other code) and wrangler to one version. To update an action:
# `git ls-remote https://github.com/<owner>/<repo> 'refs/tags/<tag>*'` (an annotated tag's commit is the ^{} line),
# read the changes, then replace the SHA and the version comment.
name: Snapshot & deploy

on:
  push:
    branches: [main]
  schedule:
    # the backup to the Cloudflare timer (cron/, :14 and :44): every two hours at :29, between the timer's runs, the odd
    # hours so 03:29 UTC carries the keepalive below
    - cron: '29 1-23/2 * * *'
  workflow_dispatch:

permissions:
  contents: read

# one deploy at a time, and a new one waits for the running one rather than cancelling it (a push every few minutes
# would otherwise cancel each run before its cards and deploy); GitHub keeps only the newest waiting run
concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # spelled out, bash runs with -o pipefail (the unnamed default does not): a failure anywhere in a pipe fails the step

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `environment:` block on purpose: environments are unavailable on private repos on the Free plan.
    steps:
      # the job's clock: the card step stops starting cards 12 minutes in, so the deploy still fits the 15-minute limit
      - name: Start the clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # only whether the secrets exist reaches this step, not their values
      - name: Cloudflare secrets are set
        env:
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_CF" != true ]; then
            echo "::error::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID: the site deploys to Cloudflare only."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false   # no GitHub token left in .git/config for the steps below
      # no npm cache: restoring it once stalled this step for ten minutes (run 2834, 2026-10-23), and npm ci below takes
      # under half a minute without it
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: '24'

      # the money math (Predict ledger and figures, copy sizing, the agent's decisions, analytics, formatting): no network,
      # a few seconds; a failure stops the job here, so nothing is deployed
      - name: Tests
        run: node --test "tests/*.test.mjs"

      # the perps build's funding charges from earlier runs (data/cache/perps-funding.json): what is over 6 hours old does
      # not change, so the build reads only the newer windows (A.fundingCharges). Kept by GitHub's cache, never deployed
      - name: Restore the perps cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: data/cache/perps-funding.json
          key: perps-funding-${{ github.run_id }}
          restore-keys: perps-funding-

      # a failure here does not stop the deploy: the published leaderboard.json goes out again (keep-live below)
      - name: Build perps snapshot (data/leaderboard.json)
        run: node scripts/build-snapshot.mjs --perps
        continue-on-error: true

      - name: Keep the perps cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830   # v4.3.0
        with:
          path: data/cache/perps-funding.json
          key: perps-funding-${{ github.run_id }}

      # The Predict snapshot, built on a home connection (the Mac mini's kit) and published to a repository of its own,
      # MeridianData-snapshots: the machine that builds it holds a token for that repository only, so nothing on it can
      # change this site's code, and what it publishes is taken as data only. Required: the Predict pages cannot query the
      # API from the site's origin, so a run that cannot read the snapshot fails here and the live deploy keeps the last
      # one (no fallback to anything older).
      - name: Fetch the Predict snapshot (MeridianData-snapshots, public)
        run: |
          for i in 1 2 3; do
            rm -rf .snap-repo
            GIT_TERMINAL_PROMPT=0 git clone --quiet --depth 1 https://github.com/MeridianDataMath/MeridianData-snapshots.git .snap-repo && exit 0
            echo "clone failed (try $i of 3)"; sleep $((i * 10))
          done
          echo "::error::MeridianData-snapshots could not be read: nothing is deployed, the live site keeps its snapshot"; exit 1

      # only regular JSON files in the published layout, within caps on their number and size, and a predict.json with
      # Predict data (scripts/check-snapshot.mjs); anything else fails the run
      - name: Add the Predict snapshot (data/predict.json, bettors/, questions/, slips/)
        run: node scripts/check-snapshot.mjs --from .snap-repo --to data

      # The Tax center's official exchange rates (data/fx/*.json): the ECB's euro reference rates, NBP table A for USD/PLN
      # and the Bank of Canada's USD/CAD, about one GET per source from a fixed start date (scripts/build-fx.mjs), plus
      # DefiLlama's daily USDe/USD price (one GET: the USDe lots' market valuation; without it the page reads DefiLlama). A
      # visitor's browser cannot read most central banks itself (no CORS). A source that fails is left out with a warning,
      # and keep-live below puts the published file back, so this step never blocks the deploy.
      - name: Official exchange rates (data/fx)
        run: node scripts/build-fx.mjs --out data/fx
        continue-on-error: true

      # what a builder above failed to write comes from the live site: the published leaderboard.json, and each exchange-
      # rate file this run lacks (scripts/keep-live.mjs). Never blocks the deploy.
      - name: Keep the live files a build did not write
        run: node scripts/keep-live.mjs
        continue-on-error: true

      # The home page's summary (data/home.json, a few KB: js/home-summary.js) from the snapshots above, so the home page
      # does not download both of them. Without it the page builds the same summary from the snapshots, so a failure here
      # never blocks the deploy.
      - name: Home page summary (data/home.json)
        run: node scripts/build-home.mjs
        continue-on-error: true

      - name: Assemble the site (dist/)
        run: |
          mkdir -p dist
          cp -r index.html css js vendor assets x-bot _headers _redirects dist/
          mkdir -p dist/agent && cp agent/copy-agent.mjs agent/package.json agent/package-lock.json agent/config.example.json dist/agent/
          cp -r data dist/ && rm -rf dist/data/cache   # the build caches stay out of the site
          echo "dist: $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1)"

      # the build tools, exactly as the root package-lock.json pins them (every package with its integrity hash): the card
      # renderer and wrangler. Installed where no secret is in the environment and without install scripts (resvg ships
      # prebuilt binaries; an assets-only deploy needs neither esbuild's nor workerd's), so the deploy action finds this
      # wrangler and skips its own `npm i`, which would run with the token set. Required: without it nothing deploys.
      # To update wrangler: bump it in package.json, `npm install --package-lock-only --ignore-scripts`, and change
      # wranglerVersion below (and in cron.yml) to match.
      - name: Install the build tools (package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # link previews: a card image per perps account, Predict wallet and shared Predict slip plus the small pages behind
      # /a/<address>, /p/<address> and /s/<prediction id> that carry them (Discord, X and co. never see the site's #/
      # routes). On every core of the runner, and no card is started after minute 12 of the job (the slips go last, the
      # oldest first). A failure deploys the site without them: until a later run builds them again, those links fall back
      # to index.html and the home page's card.
      - name: Link preview cards (dist/cards, dist/a, dist/p, dist/s)
        run: node scripts/build-cards.mjs --dist dist --jobs "$(nproc)" --deadline "$((JOB_START + 720))"
        continue-on-error: true

      # every page's scripts and stylesheets asked for with ?v=<hash of the file>, so _headers can let browsers keep them a
      # year; a reference left without its version fails the run (it would be held a year after its file changed)
      - name: Versioned scripts and stylesheets
        run: node scripts/version-assets.mjs --dist dist

      # Cloudflare takes at most 20,000 files in one version of the Worker's assets: said plainly here rather than as a
      # wrangler failure halfway through the upload
      - name: Within Cloudflare's file limit
        run: |
          n=$(find dist -type f | wc -l); echo "dist: $n files"
          if [ "$n" -gt 19500 ]; then echo "::error::dist holds $n files: Cloudflare takes 20,000 per version"; exit 1; fi

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd   # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.141.0'   # the one package-lock.json installs above (the action's default, wrangler 3, cannot deploy an assets-only Worker)
          command: deploy

  # Fails the run (GitHub mails it) when the site's data has stopped updating: the Predict snapshot live on the site over
  # two hours old, or, on a scheduled run, the timer not dispatching for over 75 minutes. Once when it starts, then daily,
  # never on every run (scripts/deploy-health.mjs); also to ntfy when the repository secret NTFY_TOPIC is set. Runs
  # whether the deploy worked or not: a failed deploy leaves the live data as it was, and that is what is checked.
  health:
    needs: deploy
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read   # the timer's dispatched runs
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: '24'
      - name: The site's data is fresh
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/deploy-health.mjs --event "${{ github.event_name }}"

  # GitHub turns a public repository's schedule off after 60 days without a commit. With the Predict snapshot published to
  # its own repository, weeks can pass without one here, so once a day a scheduled run enables this workflow again, as
  # the keepalive actions do. Its token may only manage this repository's workflows.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Keep the schedule on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%H)" = "03" ] || { echo "only in the 03:00 UTC hour"; exit 0; }
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/enable" && echo "schedule kept on" || echo "::warning::could not re-enable the workflow"
