# Builds the perps snapshot, adds the Predict snapshot pushed from a PC, and deploys the site.
#   • With the CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID secrets set → Cloudflare Worker with static assets
#     (project "meridiandatahub", see wrangler.jsonc; works from a private repo).
#   • Without them → GitHub Pages (public repos only; Settings → Pages → Source: GitHub Actions).
# Runs on every push to main, every 30 minutes, and on demand.
name: Snapshot & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `environment:` block on purpose: environments are unavailable on private repos on the Free plan.
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Build perps snapshot (data/leaderboard.json)
        run: node scripts/build-snapshot.mjs --perps
        continue-on-error: true   # an API hiccup must not take the site down; visitors fall back to a browser build

      - name: Add the Predict snapshot published from a PC (branch "snapshots" → data/)
        run: |
          mkdir -p data
          if git fetch --depth 1 origin snapshots 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C data && echo "snapshot copied: $(ls data | wc -l) entries, $(ls data/bettors 2>/dev/null | wc -l) wallet files"
          else
            echo "no snapshots branch yet"
          fi
        continue-on-error: true

      - name: Assemble the site (dist/)
        run: |
          mkdir -p dist
          cp -r index.html css js vendor assets _headers .nojekyll dist/
          [ -d data ] && cp -r data dist/ || true
          echo "dist: $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1)"

      - name: Choose target
        id: mode
        run: echo "cf=$([ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # ---- Cloudflare Worker with static assets (private repo friendly) ----
      - name: Deploy to Cloudflare
        if: steps.mode.outputs.cf == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'   # the action defaults to wrangler 3, which cannot deploy an assets-only Worker
          command: deploy

      # ---- GitHub Pages (public repo) ----
      - uses: actions/configure-pages@v5
        if: steps.mode.outputs.cf != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.mode.outputs.cf != 'true'
        with:
          path: dist
      - id: deployment
        if: steps.mode.outputs.cf != 'true'
        uses: actions/deploy-pages@v4
