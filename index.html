<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="md-build" content="dev">
  <title>MeridianDataHub</title>
  <!-- share links: /a/<address> (perps account), /p/<address> (Predict wallet) and /s/<prediction id> (Predict slip) are
       static preview pages written at deploy time (scripts/build-cards.mjs); one without a page, or an address in mixed
       case, lands here instead, as does /predict/p/<id> (Meridian's own slip path, with the domain swapped); any other
       path is the page of that name (/predict/questions → #/predict/questions; one that does not exist says so) -->
  <script>(function () { var p = location.pathname, m = /^\/(a|p)\/(0x[0-9a-fA-F]{40})\/?$/.exec(p), s = /^\/(?:predict\/p|s)\/(0x[0-9a-fA-F]{64})\/?$/.exec(p); if (m) location.replace('/#/' + (m[1] === 'a' ? 'account' : 'predict/bettor') + '?address=' + m[2].toLowerCase()); else if (s) location.replace('/#/predict/p/' + s[1].toLowerCase()); else if (p !== '/' && p !== '/index.html') location.replace('/#' + (p.replace(/\/+$/, '') || '/') + location.search); })();</script>
  <meta name="description" content="MeridianDataHub — public analytics for the Meridian exchange on Robinhood Chain: every perps account, leaderboard, live market dashboard with stop map, copy trading (copyability scores, simulator, alerts, a self-hosted copy agent), tax center, and Meridian Predict bettors, questions and resolution tracking.">
  <link rel="canonical" href="https://meridian.thedatahub.xyz/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MeridianDataHub">
  <meta property="og:url" content="https://meridian.thedatahub.xyz/">
  <meta property="og:title" content="MeridianDataHub — Meridian perps, Predict and copy-trading analytics">
  <meta property="og:description" content="Every account, the leaderboard, a live market dashboard with stop map, copy trading scored by what a follower would keep, a tax center, and Predict bettors, questions and resolution tracking for the Meridian exchange on Robinhood Chain.">
  <meta property="og:image" content="https://meridian.thedatahub.xyz/cards/site.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="MeridianDataHub: perps, Predict and copy-trading analytics for Meridian">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://meridian.thedatahub.xyz/cards/site.png">
  <meta name="twitter:title" content="MeridianDataHub — Meridian perps, Predict and copy-trading analytics">
  <meta name="twitter:description" content="Public analytics for the Meridian exchange: accounts, leaderboard, live dashboard, copy trading, tax center, Predict resolution tracking.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0e0e0f">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <nav class="rail" id="rail"></nav>
    <div class="frame">
      <header class="topbar">
        <a class="brand" href="#/">Meridian<span>DataHub</span></a>

        <form class="search-mini" id="mini-search" autocomplete="off">
          <input type="text" placeholder="Search by address…  ( / )" spellcheck="false">
        </form>
      </header>
      <main class="main" id="main">
        <div id="banner"></div>
      </main>
    </div>
  </div>
  <script defer src="js/util.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/analytics.js"></script>
  <script defer src="js/charts.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/router.js"></script>
  <script defer src="js/predict/api.js"></script>
  <script defer src="js/predict/wallets.js"></script>
  <script defer src="js/predict/analytics.js"></script>
  <script defer src="js/home-summary.js"></script>

       and agent, the Tax center. A template's scripts are not fetched; the deploy versions their addresses like the rest -->
  <template id="lazy-charts"><script src="vendor/chart.umd.js"></script></template>
  <template id="lazy-predict"><script src="js/predict/resolution.js"></script><script src="js/pages/predict.js"></script></template>
  <template id="lazy-copytools"><script src="js/copy/sim.js"></script><script src="js/copy/paper.js"></script><script src="js/pages/copysim.js"></script><script src="js/pages/copyagent.js"></script></template>

</body>
</html>
