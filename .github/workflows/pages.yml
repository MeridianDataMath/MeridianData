# Builds the shared leaderboard snapshot and publishes the site to GitHub Pages.
# Runs on every push to main, every 15 minutes, and on demand (Actions tab → Run workflow).
# One-time setup: repo Settings → Pages → "Build and deployment" → Source: GitHub Actions.
name: Snapshot & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build leaderboard snapshot (data/leaderboard.json)
        run: node scripts/build-snapshot.mjs
        continue-on-error: true   # a Meridian API hiccup must not take the site down; visitors fall back to a browser build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
