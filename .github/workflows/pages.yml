# Builds the perps snapshot, adds the Predict snapshot published from a home connection (to a repository of its own,
# see below), and deploys the site to the Cloudflare Worker with static assets (project "meridiandatahub", see
# wrangler.jsonc; works from a private repo). Needs the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID:
# without them the run fails instead of deploying anywhere else. Runs on every push to main, every 30 minutes (at :17 and
# :47, a few minutes after the snapshot machine's runs at :09 and :39), and on demand.
#
# The Cloudflare token reaches the deploy step only, never the tests, the builders, npm or git. Third-party actions are
# pinned to commits (a moved tag cannot swap in other code) and wrangler to one version. To update an action:
# `git ls-remote https://github.com/<owner>/<repo> 'refs/tags/<tag>*'` (an annotated tag's commit is the ^{} line),
# read the changes, then replace the SHA and the version comment.
name: Snapshot & deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # spelled out, bash runs with -o pipefail (the unnamed default does not): a failure anywhere in a pipe fails the step

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `environment:` block on purpose: environments are unavailable on private repos on the Free plan.
    steps:
      # the job's clock: the card step stops starting cards 12 minutes in, so the deploy still fits the 15-minute limit
      - name: Start the clock
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # only whether the secrets exist reaches this step, not their values
      - name: Cloudflare secrets are set
        env:
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_CF" != true ]; then
            echo "::error::Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID: the site deploys to Cloudflare only."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          persist-credentials: false   # no GitHub token left in .git/config for the steps below
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444   # v5.0.0
        with:
          node-version: '24'
          cache: npm   # the card renderer (package-lock.json at the root)

      # the money math (Predict ledger and figures, copy sizing, the agent's decisions, analytics, formatting): no network,
      # under a second; a failure stops the job here, so nothing is deployed
      - name: Tests
        run: node --test "tests/*.test.mjs"

      - name: Build perps snapshot (data/leaderboard.json)
        run: node scripts/build-snapshot.mjs --perps
        continue-on-error: true   # an API hiccup must not take the site down; visitors fall back to a browser build

      # The Predict snapshot, built on a home connection (scripts/Update-PredictSnapshot.ps1 on the PC, or the Mac kit's
      # copy) and published to a repository of its own, MeridianDataMath/MeridianData-snapshots: the machine that builds it
      # holds a token for that repository only, so nothing on it can change this site's code, and what it publishes is
      # taken as data only. Before that repository existed, the PC published to this repository's "snapshots" branch: both
      # are read, the newer snapshot is used. Required: the Predict pages cannot query the API from the site's origin, so a
      # run without a snapshot fails here and the live deploy keeps the last one.
      - name: Fetch the Predict snapshot (MeridianData-snapshots, public)
        run: |
          GIT_TERMINAL_PROMPT=0 git clone --quiet --depth 1 https://github.com/MeridianDataMath/MeridianData-snapshots.git .snap-repo || echo "MeridianData-snapshots: no snapshot there"

      # (once MeridianData-snapshots carries the snapshot, the "snapshots" branch can be deleted and this step with it)
      - name: Check out the Predict snapshot (branch "snapshots", from before MeridianData-snapshots)
        continue-on-error: true
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          ref: snapshots
          path: .snap-branch
          persist-credentials: false

      - name: Add the Predict snapshot (data/predict.json, bettors/, questions/, slips/)
        run: |
          # the newer of the two by predict-status.json's build time
          src=$(node -e "
            const fs = require('fs');
            const at = (d) => { try { return Number(JSON.parse(fs.readFileSync(d + '/predict-status.json', 'utf8')).builtAt) || 0; } catch (e) { return -1; } };
            const r = at('.snap-repo'), b = at('.snap-branch');
            console.log(r < 0 && b < 0 ? '' : r >= b ? '.snap-repo' : '.snap-branch');")
          if [ -z "$src" ]; then echo "::error::no Predict snapshot in MeridianData-snapshots or the snapshots branch"; exit 1; fi
          echo "Predict snapshot from $src"
          # Only regular files named as the snapshot machine publishes them. A link would publish whatever it points at (the
          # runner's environment, say), any other file would be served from the site's origin, and leaderboard.json is
          # built above.
          mkdir -p data
          (cd "$src" && find . -regextype posix-extended -type f \
            -regex '\./(predict\.json|predict-status\.json|predict-ideas\.json|bettors/0x[0-9a-f]{40}\.json|questions/0x[0-9a-fA-F]{64}\.json|slips/[0-9a-f]{2}\.json)' \
            -print0 | xargs -0 -r cp --parents -t ../data)
          # and each of them JSON, at most 25 MB (Cloudflare's limit for one file)
          node -e "
            const fs = require('fs'), path = require('path'); let n = 0;
            const files = ['predict.json', 'predict-status.json', 'predict-ideas.json'].map((f) => 'data/' + f).filter((f) => fs.existsSync(f));
            for (const d of ['bettors', 'questions', 'slips']) if (fs.existsSync('data/' + d)) for (const f of fs.readdirSync('data/' + d)) files.push(path.join('data', d, f));
            for (const f of files) {
              if (fs.statSync(f).size > 25e6) { console.error(f + ' is over 25 MB'); process.exit(1); }
              try { JSON.parse(fs.readFileSync(f, 'utf8')); n++; } catch (e) { console.error(f + ' is not JSON: ' + e.message); process.exit(1); }
            }
            const j = JSON.parse(fs.readFileSync('data/predict.json', 'utf8'));
            if (!j.agg || !(j.predictions > 0)) { console.error('data/predict.json holds no Predict data'); process.exit(1); }
            console.log(n + ' snapshot files, all JSON');"
          echo "snapshot copied: $(find data -path 'data/bettors/*' -type f | wc -l) wallet files, $(find data -path 'data/questions/*' -type f | wc -l) question files, $(find data -path 'data/slips/*' -type f | wc -l) slip files"

      # The Tax center's official exchange rates (data/fx/*.json): the ECB's euro reference rates, NBP table A for USD/PLN
      # and the Bank of Canada's USD/CAD, about one GET per source from a fixed start date (scripts/build-fx.mjs), plus
      # DefiLlama's daily USDe/USD price (one GET: the USDe lots' market valuation; without it the page reads DefiLlama). A
      # visitor's browser cannot read most central banks itself (no CORS). A source that fails is left out with a warning
      # and the page falls back to the ECB's rates (frankfurter.dev), so this step never blocks the deploy.
      - name: Official exchange rates (data/fx)
        run: node scripts/build-fx.mjs --out data/fx
        continue-on-error: true

      - name: Assemble the site (dist/)
        run: |
          mkdir -p dist
          cp -r index.html css js vendor assets x-bot _headers dist/
          mkdir -p dist/agent && cp agent/copy-agent.mjs agent/package.json agent/package-lock.json agent/config.example.json dist/agent/
          cp -r data dist/
          echo "dist: $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1)"

      # the build tools, exactly as the root package-lock.json pins them (every package with its integrity hash): the card
      # renderer and wrangler. Installed where no secret is in the environment and without install scripts (resvg ships
      # prebuilt binaries; an assets-only deploy needs neither esbuild's nor workerd's), so the deploy action finds this
      # wrangler and skips its own `npm i`, which would run with the token set. Required: without it nothing deploys.
      # To update wrangler: bump it in package.json, `npm install --package-lock-only --ignore-scripts`, and change
      # wranglerVersion below to match.
      - name: Install the build tools (package-lock.json)
        run: npm ci --ignore-scripts --no-audit --no-fund

      # link previews: a card image per perps account, Predict wallet and shared Predict slip plus the small pages behind
      # /a/<address>, /p/<address> and /s/<prediction id> that carry them (Discord, X and co. never see the site's #/
      # routes). On every core of the runner, and no card is started after minute 12 of the job (the slips go last, the
      # oldest first). A failure deploys the site without them: until a later run builds them again, those links fall back
      # to index.html and the home page's card.
      - name: Link preview cards (dist/cards, dist/a, dist/p, dist/s)
        run: node scripts/build-cards.mjs --dist dist --jobs "$(nproc)" --deadline "$((JOB_START + 720))"
        continue-on-error: true

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd   # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.141.0'   # the one package-lock.json installs above (the action's default, wrangler 3, cannot deploy an assets-only Worker)
          command: deploy

  # GitHub turns a public repository's schedule off after 60 days without a commit. With the Predict snapshot published to
  # its own repository, weeks can pass without one here, so once a day a scheduled run enables this workflow again, as
  # the keepalive actions do. Its token may only manage this repository's workflows.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Keep the schedule on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$(date -u +%H)" = "03" ] || { echo "only in the 03:00 UTC hour"; exit 0; }
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/pages.yml/enable" && echo "schedule kept on" || echo "::warning::could not re-enable the workflow"
